<style>
:root{
  --paper:#139AC8;        /* turchese parete del bar */
  --paper-card:#FFFFFF;
  --ink:#0A2A35;
  --ink-soft:#4A6570;
  --on-bg:#062631;        /* testo direttamente sul turchese */
  --teal:#0F7FA6;
  --teal-deep:#0A4F66;
  --sunset:#0A4F66;       /* prezzi: blu profondo */
  --line:#D6E7EE;
  --shadow: 0 2px 6px rgba(6,38,49,.18);
  color-scheme: only light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--paper);}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Fraunces','Georgia',serif;
  font-weight:600;
  letter-spacing:-.01em;
}
.book{
  display:flex;
  height:100dvh;
  width:100vw;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.book::-webkit-scrollbar{display:none;}
.page{
  flex:0 0 100vw;
  height:100dvh;
  scroll-snap-align:start;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  padding:64px 22px 96px 34px;
  -webkit-overflow-scrolling:touch;
}
.page::before{
  content:"";
  position:absolute;
  left:14px; top:0; bottom:0;
  width:1px;
  background-image:linear-gradient(var(--line) 60%, transparent 0%);
  background-size:1px 10px;
  background-repeat:repeat-y;
  opacity:.9;
}
.page::after{
  content:"";
  position:absolute; left:8px; top:0; bottom:0; width:13px;
  background-image: radial-gradient(circle, var(--paper-card) 2.6px, transparent 2.8px);
  background-size: 13px 34px;
  background-position: 0 20px;
  opacity:.9;
}
.hole-dummy{display:none;}

/* ---- top chapter nav ---- */
.topnav{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; gap:8px; overflow-x:auto;
  padding:10px 14px 10px 40px;
  background:linear-gradient(var(--paper) 70%, transparent);
  -webkit-overflow-scrolling:touch;
}
.topnav::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  font-family:'Inter',sans-serif;
  font-size:12.5px; font-weight:600;
  color:var(--ink-soft);
  background:transparent;
  border:1px solid var(--line);
  padding:6px 13px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.chip.active{
  background:var(--on-bg);
  border-color:var(--on-bg);
  color:#fff;
}

/* ---- bottom nav ---- */
.botnav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom)) 40px;
  background:linear-gradient(transparent, var(--paper) 35%);
}
.navbtn{
  width:42px; height:42px; border-radius:50%;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--teal-deep);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.navbtn:active{transform:scale(.94);}
.navbtn svg{width:18px;height:18px;}
.navbtn[disabled]{opacity:.3; pointer-events:none;}
.pageinfo{
  font-size:12px; color:var(--ink-soft); text-align:center;
  display:flex; flex-direction:column; gap:2px;
}
.pageinfo b{color:var(--ink); font-size:13px; font-family:'Fraunces',serif; font-weight:600;}
.progress{
  position:fixed; bottom:0; left:0; height:3px; background:#FFFFFF;
  z-index:41; transition:width .25s;
}

/* ---- cover ---- */
.cover{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:6px;}
.logowrap{background:#F4ECD8; border-radius:50%; padding:8px; margin-bottom:6px; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.12);}
.logowrap img{display:block; mix-blend-mode:multiply; border-radius:50%; object-fit:cover; aspect-ratio:1/1;}
.cover .logowrap img{width:160px; height:160px;}
.cover .kicker{color:var(--on-bg); font-size:12.5px; letter-spacing:.06em; margin-bottom:2px;}
.cover h1{font-size:22px; margin:0 0 22px 0; color:var(--ink);}
.hours-card{background:var(--paper-card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; max-width:320px; width:100%; box-shadow:var(--shadow); margin-bottom:14px;}
.hours-card h3{font-size:13px; color:var(--teal-deep); margin:0 0 10px; text-align:center;}
.hours-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px dotted var(--line);}
.hours-row:last-child{border-bottom:none;}
.hours-row span:first-child{font-weight:600;}
.hint{margin-top:20px; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.hint svg{width:16px;height:16px; animation:nudge 1.6s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}

/* ---- page header ---- */
.pagehead{margin-bottom:18px;}
.pagehead .eyebrow{color:var(--on-bg); font-size:12px; font-weight:600; margin-bottom:2px;}
.pagehead h2{font-size:24px; margin:0 0 4px 0; color:var(--ink);}
.pagehead .sub{color:var(--ink-soft); font-size:13px;}
.subnav{display:flex; gap:7px; flex-wrap:wrap; margin:14px 0 4px;}
.subchip{font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:14px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper-card); cursor:pointer;}
.subchip.active{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}

/* ---- listino (caffetteria/drink) ---- */
.listino{margin-top:12px;}
.litem{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px dotted var(--line);}
.litem .l-name{font-size:14.5px; font-weight:600;}
.litem .l-sub{font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-left:5px;}
.litem .l-comp{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-top:2px; line-height:1.4;}
.litem .l-price{font-size:14px; font-weight:700; color:var(--sunset); white-space:nowrap;}
.section-title{font-size:13px; font-weight:700; color:var(--on-bg); text-transform:uppercase; letter-spacing:.05em; margin:22px 0 4px;}
.note{margin-top:16px; font-size:12px; color:var(--teal-deep); font-weight:600; text-align:center; background:var(--paper-card); border:1px dashed var(--teal); border-radius:10px; padding:9px 12px;}

/* ---- cards (gin/vini/rum/whisky) ---- */
.grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px;}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:900px){.grid,.listino,.pagehead,.subnav,.cover,.hours-card{max-width:820px;}}
.card{background:var(--paper-card); border-left:3px solid var(--teal); border-radius:4px 10px 10px 4px; padding:11px 14px; box-shadow:var(--shadow);}
.card .c-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.card .c-name{font-size:14px; font-weight:700; line-height:1.3;}
.card .c-price{font-size:13.5px; font-weight:700; color:var(--sunset); white-space:nowrap;}
.card .c-origin{font-size:11px; color:var(--teal); font-weight:600; margin-top:2px;}
.card .c-desc{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.45;}

.curiosita{margin-top:20px; background:var(--paper-card); border:1px solid var(--teal); border-radius:12px; padding:14px 16px;}
.curiosita h4{margin:0 0 6px; color:var(--teal-deep); font-size:14px;}
.curiosita p{margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-soft);}

.footerpage{display:flex; align-items:center; justify-content:center; height:100%; text-align:center; flex-direction:column; gap:10px;}
.footerpage img{width:90px; opacity:.85;}
.footerpage p{font-family:'Fraunces',serif; font-size:15px; color:var(--ink-soft); max-width:260px;}

/* --- tema turchese Belverde --- */
.pagehead h2{color:var(--on-bg);}
.pagehead .sub,.hint,.pageinfo,.pageinfo span{color:var(--on-bg);}
.pageinfo b{color:var(--on-bg);}
.chip{color:var(--on-bg); border-color:rgba(6,38,49,.35); background:rgba(255,255,255,.35);}
.listino{background:var(--paper-card); border-radius:12px; padding:2px 14px; box-shadow:var(--shadow);}
.litem:last-child{border-bottom:none;}
.page::before{background-image:linear-gradient(rgba(255,255,255,.7) 60%, transparent 0%);}
.logowrap{background:#FFFFFF !important;}
.footerpage p{color:var(--on-bg);}
.subchip{border-color:transparent;}

/* --- spazio sicuro sotto le barre di sistema/app (iPhone, Android) --- */
.topnav{padding-top:calc(10px + env(safe-area-inset-top, 0px));}
.page{padding-top:calc(72px + env(safe-area-inset-top, 0px));}
.page::-webkit-scrollbar{display:none;}
.pagehead .eyebrow{font-size:12.5px;}
</style>
</head>

const COVER = "\n<div class=\"cover\">\n  <div class=\"logowrap\"><img src=\"%%LOGO%%\" alt=\"Bar Belverde\"><\/div>\n  <div class=\"hours-card\"><h3>Orari di apertura<\/h3>\n<div class=\"hours-row\"><span>Luned&igrave; - Gioved&igrave;<\/span><span>6:30 - 21:00<\/span><\/div>\n<div class=\"hours-row\"><span>Venerd&igrave;<\/span><span>6:30 - 22:00<\/span><\/div>\n<div class=\"hours-row\"><span>Sabato<\/span><span>7:00-12:30 &bull; 17:00-22:00<\/span><\/div>\n<\/div>\n  <div class=\"hours-card\"><h3>Cucina<\/h3>\n<div class=\"hours-row\"><span>Lun - Ven<\/span><span>pranzo 12:00-13:30<\/span><\/div>\n<div class=\"hours-row\"><span><\/span><span>aperitivo 17:30-20:30<\/span><\/div>\n<div class=\"hours-row\"><span>Sabato<\/span><span>aperitivo 17:00-21:00<\/span><\/div>\n<\/div>\n  <div style=\"font-size:11.5px;color:var(--on-bg);margin-top:4px;max-width:300px;text-align:center;\">Per informazioni su allergeni e intolleranze chiedi al personale.<\/div>\n  <div class=\"hint\">Scorri per sfogliare il menu\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n  <\/div>\n<\/div>\n";

const SECTIONS = [
  {key:"Caffetteria", chip:"Caffè", eyebrow:"Colazione", title:"Caffetteria", sub:"Caffè, colazione e bevande calde", style:"list"},
  {key:"Drink", chip:"Drink", eyebrow:"Aperitivo", title:"Drink", sub:"Aperitivi e cocktail", style:"list"},
  {key:"I nostri cocktail", chip:"Cocktail", eyebrow:"La casa", title:"I nostri cocktail", sub:"Alcolici e analcolici", style:"list"},
  {key:"Gin", chip:"Gin", eyebrow:"Menu dei gin", style:"cards", paged:true, count:true},
  {key:"Vini", chip:"Vini", eyebrow:"Carta dei vini", style:"cards", paged:true},
  {key:"Rum", chip:"Rum", eyebrow:"Distillati", title:"Rum", sub:"", style:"cards"},
  {key:"Whisky & Tequila", chip:"Whisky", eyebrow:"Distillati", title:"Whisky & Tequila", sub:"", style:"cards"},
];
const SHORT = {
  "classici e london dry":"Classici", "dal mondo & contemporanei":"Dal Mondo & Contemporanei",
  "mediterranei e italiani":"Mediterranei", "floreali, fruttati e agrumati":"Floreali", "speziati e insoliti":"Speziati",
  "vini bianchi italiani":"Bianchi", "bollicine - franciacorta - prosecco - trentodoc":"Bollicine",
  "rossi italiani - le regioni":"Rossi Regioni", "rossi dal mondo":"Rossi Mondo", "rossi italiani - i grandi":"I Grandi"
};

// ---------- utilita ----------
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = p => { p = String(p ?? "").trim(); if (!p) return "";
  return p.split("/").map(x => { x = x.trim(); return /€/.test(x) ? x : x + "€"; }).join(" / "); };
const isNote = r => norm(r.Nome) === "nota";

function parseCSV(text) {
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  return out;
}
function rowsFromCSV(text) {
  const t = parseCSV(text || ""); if (t.length < 2) return null;
  const hdr = t[0].map(norm);
  const K = ["Sezione","Categoria","Nome","Dettaglio","Origine","Descrizione","Prezzo","Visibile"];
  const pos = Object.fromEntries(K.map(k => [k, hdr.indexOf(norm(k))]));
  if (pos.Sezione < 0 || pos.Nome < 0) return null;
  const rows = [];
  for (const r of t.slice(1)) {
    const o = {}; for (const k of K) o[k] = pos[k] >= 0 ? String(r[pos[k]] ?? "").trim() : "";
    if (o.Sezione && o.Nome) rows.push(o);
  }
  return rows.length >= 5 ? rows : null;
}

// ---------- blocchi grafici ----------
function listHTML(items) {
  return '<div class="listino">' + items.map(it =>
    `<div class="litem"><span><span class="l-name">${esc(it.Nome)}</span>` +
    (it.Dettaglio ? `<span class="l-sub">${esc(it.Dettaglio)}</span>` : "") +
    (it.Descrizione ? `<span class="l-comp">${esc(it.Descrizione)}</span>` : "") +
    `</span><span class="l-price">${esc(eur(it.Prezzo))}</span></div>`).join("") + "</div>";
}
function cardsHTML(items) {
  return '<div class="grid">' + items.map(it =>
    `<div class="card"><div class="c-top"><span class="c-name">${esc(it.Nome)}` +
    (it.Dettaglio ? ` <span class="l-sub">${esc(it.Dettaglio)}</span>` : "") + `</span>` +
    (it.Prezzo ? `<span class="c-price">${esc(eur(it.Prezzo))}</span>` : "") + `</div>` +
    (it.Origine ? `<div class="c-origin">${esc(it.Origine)}</div>` : "") +
    (it.Descrizione ? `<div class="c-desc">${esc(it.Descrizione)}</div>` : "") + `</div>`).join("") + "</div>";
}
function noteHTML(n) {
  return n.Dettaglio
    ? `<div class="curiosita"><h4>${esc(n.Dettaglio)}</h4><p>${esc(n.Descrizione)}</p></div>`
    : `<div class="note">${esc(n.Descrizione)}</div>`;
}
const head = (eyebrow, title, sub) =>
  `<div class="pagehead">${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}<h2>${esc(title)}</h2>` +
  (sub ? `<div class="sub">${esc(sub)}</div>` : "") + `</div>`;
const uniq = a => a.filter((x, i) => a.findIndex(y => norm(y) === norm(x)) === i);

// ---------- costruzione pagine ----------
function build(allRows) {
  const rows = allRows.filter(r => !norm(r.Visibile).startsWith("n"));
  const bySec = new Map();
  for (const r of rows) { const k = norm(r.Sezione); if (!bySec.has(k)) bySec.set(k, {name: r.Sezione.trim(), rows: []}); bySec.get(k).rows.push(r); }
  const order = SECTIONS.map(s => norm(s.key)).filter(k => bySec.has(k));
  for (const k of bySec.keys()) if (!order.includes(k)) order.push(k);

  const pages = [{title:"Bar Belverde", chapter:"cover", html: COVER.replaceAll("%%LOGO%%", LOGO)}];
  const chips = [{label:"Bar Belverde", chapter:"cover", page:0}];

  for (const k of order) {
    const sec = bySec.get(k);
    const cfg = SECTIONS.find(s => norm(s.key) === k) || {key:sec.name, chip:sec.name, eyebrow:"", title:sec.name, sub:"", style:"list"};
    const notes = sec.rows.filter(isNote), items = sec.rows.filter(r => !isNote(r));
    const secNotes = notes.filter(n => !n.Categoria);
    const block = cfg.style === "cards" ? cardsHTML : listHTML;
    chips.push({label:cfg.chip, chapter:k, page:pages.length});

    if (cfg.paged) {
      const cats = uniq(items.map(i => i.Categoria || "Altri"));
      const first = pages.length;
      cats.forEach((cat, i) => {
        const catItems = items.filter(it => norm(it.Categoria || "Altri") === norm(cat));
        const catNotes = notes.filter(n => n.Categoria && norm(n.Categoria) === norm(cat));
        const sub = [...secNotes, ...catNotes].filter(n => !n.Dettaglio).map(n => n.Descrizione).join(" · ");
        const eyebrow = `${cfg.eyebrow} • ${i + 1} di ${cats.length}` + (cfg.count ? ` • ${items.length} etichette` : "");
        const subnav = '<div class="subnav">' + cats.map((c, j) =>
          `<span class="subchip" data-page="${first + j}">${esc(SHORT[norm(c)] || c)}</span>`).join("") + "</div>";
        const boxes = catNotes.filter(n => n.Dettaglio).map(noteHTML).join("");
        pages.push({title:cat, chapter:k, html: head(eyebrow, cat, sub) + subnav + block(catItems) + boxes});
      });
    } else {
      const cats = uniq([...items, ...notes.filter(n => n.Categoria)].map(r => r.Categoria || ""));
      let body = "";
      for (const cat of cats) {
        const catItems = items.filter(it => norm(it.Categoria) === norm(cat));
        const catNotes = notes.filter(n => cat && norm(n.Categoria) === norm(cat));
        if (cat && norm(cat) !== norm(cfg.title)) body += `<div class="section-title">${esc(cat)}</div>`;
        if (catItems.length) body += block(catItems);
        body += catNotes.map(noteHTML).join("");
      }
      body += secNotes.map(noteHTML).join("");
      pages.push({title:cfg.title, chapter:k, html: head(cfg.eyebrow, cfg.title, cfg.sub) + body});
    }
  }
  pages[pages.length - 1].html +=
    `<div class="footerpage" style="height:auto;padding-top:26px;"><div class="logowrap" style="padding:6px;">` +
    `<img src="${LOGO}" alt="Bar Belverde" style="width:70px;height:70px;"></div><p>${esc(FOOTER)}</p></div>`;
  return {pages, chips};
}

// ---------- navigazione ----------
const book = document.getElementById("book");
const topnav = document.getElementById("topnav");
const pageInfo = document.getElementById("pageinfo-title");
const pageCount = document.getElementById("pageinfo-count");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");
const allPages = () => Array.from(document.querySelectorAll(".page"));
const currentIndex = () => Math.round(book.scrollLeft / book.clientWidth);
function goTo(i, instant) {
  const n = allPages().length; i = Math.max(0, Math.min(n - 1, i));
  book.scrollTo({left: i * book.clientWidth, behavior: instant ? "instant" : "smooth"});
}
function update() {
  const pages = allPages(); if (!pages.length) return;
  const i = Math.min(currentIndex(), pages.length - 1), p = pages[i];
  pageInfo.textContent = p.dataset.title || "";
  pageCount.textContent = (i + 1) + " / " + pages.length;
  prevBtn.disabled = i === 0; nextBtn.disabled = i === pages.length - 1;
  progress.style.width = ((i + 1) / pages.length * 100) + "%";
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.chapter === p.dataset.chapter));
  document.querySelectorAll(".subchip").forEach(c => c.classList.toggle("active", c.dataset.page === String(i)));
  const a = document.querySelector(".chip.active");
  if (a) a.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}
let t; book.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(update, 60); });
prevBtn.addEventListener("click", () => goTo(currentIndex() - 1));
nextBtn.addEventListener("click", () => goTo(currentIndex() + 1));
document.addEventListener("click", e => { const c = e.target.closest("[data-page]"); if (c) goTo(parseInt(c.dataset.page)); });
window.addEventListener("keydown", e => { if (e.key === "ArrowRight") goTo(currentIndex() + 1); if (e.key === "ArrowLeft") goTo(currentIndex() - 1); });

function render(rows) {
  const keep = book.children.length ? currentIndex() : 0;
  const {pages, chips} = build(rows);
  book.innerHTML = pages.map(p => `<section class="page" data-title="${esc(p.title)}" data-chapter="${esc(p.chapter)}">${p.html}</section>`).join("");
  topnav.innerHTML = chips.map(c => `<button class="chip" data-chapter="${esc(c.chapter)}" data-page="${c.page}">${esc(c.label)}</button>`).join("");
  goTo(keep, true); update();
}

// ---------- avvio: prima la copia salvata, poi il foglio aggiornato ----------
let cached = null;
try { cached = localStorage.getItem("belverde-menu-csv"); } catch (e) {}
render((cached && rowsFromCSV(cached)) || FALLBACK);
(async () => {
  for (const url of SHEET_URLS) {
    try {
      const r = await fetch(url + "&t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) continue;
      const text = await r.text();
      const rows = rowsFromCSV(text);
      if (!rows) continue;
      if (text !== cached) {
        try { localStorage.setItem("belverde-menu-csv", text); } catch (e) {}
        render(rows);
      }
      return;
    } catch (e) {}
  }
})();

</script>
